name: YN MT5 Vision APK
on:
  push:
    branches:
      - mt5-vision-apk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Strategy gate smoke tests
        run: |
          mkdir -p /tmp/yn-tests
          javac -d /tmp/yn-tests app/src/main/java/com/yn/mt5vision/StrategyEngine.java app/src/main/java/com/yn/mt5vision/CandlePalette.java app/src/main/java/com/yn/mt5vision/SignalGuard.java tests/StrategySmokeTest.java
          java -cp /tmp/yn-tests com.yn.mt5vision.StrategySmokeTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: YN-MT5-Vision-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
