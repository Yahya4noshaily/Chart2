plugins {
    id 'com.android.application'
}
android {
    namespace 'com.yn.mt5vision'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yn.mt5vision'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1-beta'
        // Lightweight ARM64 build for the user's 64-bit Android handset.
        // Drops three unused native OCR architectures (~25 MB).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
